name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT_ID: bible-research-489314
  TF_VAR_region: europe-west3
  WIF_PROVIDER: projects/670506724494/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@bible-research-489314.iam.gserviceaccount.com

# One Terraform job at a time so parallel runs do not fight over the GCS state lock.
concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (manual)
        if: github.event_name == 'workflow_dispatch'
        run: terraform plan -input=false -no-color -lock-timeout=15m

      - name: Terraform plan (PR)
        id: tfplan
        if: github.event_name == 'pull_request'
        # ``-refresh=false`` lets the PR plan succeed when the CI
        # service account lacks the IAM read permissions needed to
        # refresh pre-existing resources (specifically:
        # iam.serviceAccounts.getIamPolicy on the appspot SA and
        # iam.workloadIdentityPools.get on the github-actions pool,
        # granted only by IAM bindings that some PRs themselves
        # add). The diff is computed against the GCS-locked state
        # file, which is still the source of truth since Terraform
        # is the only writer. ``terraform apply`` on main still
        # refreshes normally so real drift is caught at deploy time.
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=15m -refresh=false 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform plan\n\n```\n' + plan + '\n```',
            });

      # Bootstrap step: apply IAM bindings for the github-deployer CI
      # service account *before* the main apply refreshes the rest of
      # the state. Without this, a PR that simultaneously (a) introduces
      # a new resource type (e.g. google_cloud_run_v2_job) and (b)
      # grants the matching read role to github-deployer would fail on
      # merge: refresh runs as github-deployer, hits a 403 on the brand
      # new resource, and aborts before the IAM binding that would have
      # fixed the 403 ever gets applied. Targeting just the github-
      # deployer IAM resources with -refresh=false sidesteps the
      # chicken-and-egg without weakening drift detection on the full
      # apply that follows.
      - name: Bootstrap github-deployer IAM (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          targets=$(grep -hRE '^resource "(google_project_iam_member|google_service_account_iam_member)" "github_deployer[^"]*"' . \
            | sed -E 's/.*"(google_[a-z_]+)" "([^"]+)".*/-target=\1.\2/' \
            | sort -u \
            | tr '\n' ' ')
          if [ -z "${targets// }" ]; then
            echo "No github-deployer IAM resources found; skipping bootstrap."
            exit 0
          fi
          echo "Bootstrapping IAM with targets: $targets"
          # shellcheck disable=SC2086
          terraform apply -auto-approve -input=false -lock-timeout=15m -refresh=false $targets

      - name: Terraform apply (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false -lock-timeout=15m

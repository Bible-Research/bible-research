name: Deploy to App Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: bible-research-489314
  GCP_REGION: europe-west3
  WIF_PROVIDER: projects/670506724494/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@bible-research-489314.iam.gserviceaccount.com
  AUDIO_JOB_NAME: audio-generator

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Run database migrations
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GAE_APPLICATION: s~${{ env.GCP_PROJECT_ID }}
        run: python manage.py migrate --noinput

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml \
            --project="${GCP_PROJECT_ID}" \
            --quiet --promote --stop-previous-version

      - name: Recent serving versions
        run: |
          gcloud app versions list \
            --project="${GCP_PROJECT_ID}" \
            --hide-no-traffic \
            --sort-by=~last_deployed_time \
            --limit=5

      # Keep the audio-generator Cloud Run Job pinned to the same
      # immutable image digest that App Engine just started serving.
      # Terraform ignores changes to this field (see audio_generator.tf
      # lifecycle block), so only this step drives the image reference.
      - name: Sync audio-generator Cloud Run Job image
        run: |
          set -euo pipefail

          VERSION=$(gcloud app versions list \
            --project="${GCP_PROJECT_ID}" \
            --service=default \
            --hide-no-traffic \
            --sort-by=~last_deployed_time \
            --limit=1 \
            --format='value(version.id)')
          echo "Current serving GAE version: ${VERSION}"

          IMAGE=$(gcloud app versions describe "${VERSION}" \
            --project="${GCP_PROJECT_ID}" \
            --service=default \
            --format='value(deployment.container.image)')
          echo "Current GAE image ref: ${IMAGE}"

          # Resolve the (mutable) tag to an immutable digest so the
          # scheduled monthly job always runs the exact image that
          # shipped, even after subsequent deploys overwrite the tag.
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')
          IMAGE_NO_TAG="${IMAGE%:*}"
          IMMUTABLE="${IMAGE_NO_TAG}@${DIGEST}"
          echo "Immutable image ref: ${IMMUTABLE}"

          gcloud run jobs update "${AUDIO_JOB_NAME}" \
            --image="${IMMUTABLE}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}"

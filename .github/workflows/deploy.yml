name: Deploy to App Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: bible-research-489314
  WIF_PROVIDER: projects/670506724494/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@bible-research-489314.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Run database migrations
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GAE_APPLICATION: s~${{ env.GCP_PROJECT_ID }}
        run: python manage.py migrate --noinput

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml \
            --project="${GCP_PROJECT_ID}" \
            --quiet --promote --stop-previous-version

      - name: Recent serving versions
        run: |
          gcloud app versions list \
            --project="${GCP_PROJECT_ID}" \
            --hide-no-traffic \
            --sort-by=~last_deployed_time \
            --limit=5

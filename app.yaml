runtime: python312
env: standard

# This keeps you on the Free Tier by limiting to 1 instance
automatic_scaling:
  max_instances: 1
  min_instances: 0

# This points to your Django project's WSGI file
entrypoint: gunicorn -b :$PORT bible_research.wsgi

handlers:
# For static files (CSS, JS, Images)
- url: /static
  static_dir: static/

# All other URLs go to your Django app
- url: /.*
  script: auto
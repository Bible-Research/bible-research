runtime: python312
env: standard
instance_class: F1

# Always keep 1 instance running (min_instances=1)
automatic_scaling:
  max_instances: 1
  min_instances: 1

# This points to your Django project's WSGI file
entrypoint: gunicorn -b :$PORT bible_research.wsgi

handlers:
# Serve favicon.ico directly as a static file
- url: /favicon.ico
  static_files: static/favicon.ico
  upload: static/favicon.ico

# For static files (CSS, JS, Images)
- url: /static
  static_dir: static/

# All other URLs go to your Django app
- url: /.*
  script: auto